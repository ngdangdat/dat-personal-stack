services:
  db:
    image: postgres:16-alpine
    container_name: engineering-assistant-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-engineering_assistant}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres-secret-pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: engineering-assistant-backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres-secret-pass@db:5432/engineering_assistant?sslmode=disable}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-default-32-byte-encryption-key!!}
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - app-network

  node-agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: engineering-assistant-node-agent
    command: ["./node_agent"]
    ports:
      - "8081:8081"
    environment:
      - PORT=${PORT:-8081}
      - AGENT_SECRET_TOKEN=${AGENT_SECRET_TOKEN:-agent-secret-token}
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: engineering-assistant-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
