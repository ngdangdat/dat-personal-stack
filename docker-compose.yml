services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: engineering-assistant-backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - app-network

  node-agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: engineering-assistant-node-agent
    command: ["./node_agent"]
    ports:
      - "8081:8081"
    environment:
      - PORT=${PORT:-8081}
      - AGENT_SECRET_TOKEN=${AGENT_SECRET_TOKEN:-agent-secret-token}
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: engineering-assistant-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
